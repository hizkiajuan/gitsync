name: Release

# The maintainer's release (hzkjn-release) bumps Cargo.toml, writes CHANGELOG.md, pushes a vX.Y.Z
# tag and creates the GitHub release. This workflow then checks and bundles the tagged commit on
# macOS. GitSync ships source-only releases for now; signing, notarization and attaching the app
# to the release are added here once binaries ship. Until then the ad-hoc signed app is kept as a
# workflow artifact for the maintainer to install (run it by hand to build one from any branch).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # bundle.sh counts commits for the build number
          persist-credentials: false
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest,cargo-about
      - run: cargo nextest run
      - run: GITSYNC_BUILD_PROFILE=release ./scripts/bundle.sh
      # ditto keeps the bundle's symlinks and permissions, which a plain zip of the folder loses.
      - run: ditto -c -k --keepParent dist/GitSync.app dist/GitSync.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GitSync-${{ github.ref_name }}
          path: dist/GitSync.zip
          retention-days: 90
