# cargo-deny rules. Run `cargo deny check` locally; CI runs it on every pull request.

[graph]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates with no maintained release to move to. All arrive
# through gpui-kit (gpui-base, gpui-component, cosmic-text, resvg, syntect),
# not from GitSync's own code; drop each entry once gpui moves off it.
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 1, via syntect in gpui-base" },
    { id = "RUSTSEC-2024-0384", reason = "instant, via gpui-base" },
    { id = "RUSTSEC-2024-0436", reason = "paste, via gpui-component" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile, via gpui-pre-reqwest" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz, via resvg in gpui-component" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser, via cosmic-text in gpui-pre-wgpu" },
    { id = "RUSTSEC-2026-0543", reason = "chrono, via gpui-base, gpui-component and gpui-pre" },
]

[licenses]
version = 2
# GitSync is MIT. These licenses are compatible with it. MPL-2.0 is file-level
# copyleft: GitSync does not modify those crates, and the bundle ships their
# license texts in THIRD_PARTY_LICENSES.html.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OFL-1.1",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
