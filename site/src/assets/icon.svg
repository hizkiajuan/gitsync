<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- macOS icon grid: the shared dock tile drawn as an 824 px body inset 100 px. The original
       branch-loop mark in two colors: lime for the local lane, paper for the remote lane that
       loops back into it ("GitSync: logo" canvas in Doop, pick G). -->
  <g transform="translate(100 100) scale(8.24)">
  <defs>
    <linearGradient id="gs-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1D1C1B"/><stop offset="1" stop-color="#0A0A0A"/></linearGradient>
    <linearGradient id="gs-accent" gradientUnits="userSpaceOnUse" x1="4" y1="2" x2="12" y2="22"><stop offset="0" stop-color="#D4FF4D"/><stop offset="1" stop-color="#A6E600"/></linearGradient>
    <linearGradient id="gs-paper" gradientUnits="userSpaceOnUse" x1="10" y1="2" x2="21" y2="20"><stop offset="0" stop-color="#F6F2EB"/><stop offset="1" stop-color="#D9D2C6"/></linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#gs-bg)"/>
  <g transform="translate(13.35 15.05) scale(2.9126)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="url(#gs-paper)">
      <path d="M7 19h3.5c4.5 0 8-1.5 8-4.8"/>
      <path d="M18.5 9.8c0-3.3-3-4.8-7.5-4.8"/>
      <path d="M13.5 2.5 11 5l2.5 2.5"/>
      <circle cx="18.5" cy="12" r="2.2"/>
    </g>
    <g stroke="url(#gs-accent)">
      <path d="M7 5v14"/>
      <circle cx="7" cy="5" r="2.5" fill="url(#gs-accent)" stroke="none"/>
      <circle cx="7" cy="19" r="2.5" fill="url(#gs-accent)" stroke="none"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="99" height="99" rx="21.5" fill="none" stroke="#fff" stroke-opacity=".07"/>
</g>
</svg>
